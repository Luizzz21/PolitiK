<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolitiK - Gastos Parlamentares</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .card { max-width: 650px; margin: 20px auto; background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin: 0 0 8px 0; font-size: 22px; color: #1a1a1a; text-align: center; }
        .total { font-size: 20px; font-weight: bold; color: #c62828; text-align: center; margin-bottom: 24px; }
        .footer { font-size: 12px; color: #757575; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Gastos da Cota Parlamentar</h1>
    <div class="total" id="total">Carregando dados...</div>
    <canvas id="grafico"></canvas>
    <div class="footer" id="data"></div>
</div>

<script>
    fetch('dados.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(d => {
            document.getElementById('total').innerText = "Total: R$ " + d.total.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById('data').innerText = "Atualizado em: " + d.atualizado_em;

            const ctx = document.getElementById('grafico').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(d.gastos),
                    datasets: [{
                        label: 'Despesas (R$)',
                        data: Object.values(d.gastos),
                        backgroundColor: '#1976d2',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        })
        .catch(err => {
            document.getElementById('total').innerText = "Erro ao carregar dados.";
        });
</script>

</body>
</html>
