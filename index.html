<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1 id="titulo">Carregando...</h1>
    <h2 id="total"></h2>
    <canvas id="grafico" width="400" height="200"></canvas>
    <p id="data"></p>

    <script>
        fetch('dados.json?t=' + new Date().getTime())
        .then(r => r.json())
        .then(d => {
            document.getElementById('titulo').innerText = "Gastos Parlamentares";
            document.getElementById('total').innerText = "Total: R$ " + d.total.toFixed(2);
            document.getElementById('data').innerText = "Atualizado em: " + d.atualizado_em;
            
            new Chart(document.getElementById('grafico'), {
                type: 'bar',
                data: {
                    labels: Object.keys(d.gastos),
                    datasets: [{ label: 'R$', data: Object.values(d.gastos), backgroundColor: 'blue' }]
                }
            });
        });
    </script>
</body>
</html>
