<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolitiK - Monitor de Gastos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 16px; }
        .card { max-width: 720px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { margin: 0 0 16px 0; font-size: 20px; color: #1a1a1a; text-align: center; }
        .filtros { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select { flex: 1; min-width: 150px; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
        .total-container { text-align: center; margin-bottom: 20px; }
        .total-label { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
        .total-valor { font-size: 24px; font-weight: bold; color: #c62828; margin-top: 4px; }
        .chart-container { position: relative; width: 100%; min-height: 280px; }
        .footer { font-size: 11px; color: #888; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Transparência Pública - PolitiK</h1>

    <div class="filtros">
        <select id="selectCargo" onchange="filtrarPoliticos()">
            <option value="Todos">Todos os Cargos</option>
            <option value="Presidente">Presidente</option>
            <option value="Governador">Governador</option>
            <option value="Senador">Senador</option>
            <option value="Deputado Federal">Deputado Federal</option>
            <option value="Deputado Estadual">Deputado Estadual</option>
            <option value="Prefeito">Prefeito</option>
        </select>

        <select id="selectPolitico" onchange="renderizarDados()">
            <option>Carregando...</option>
        </select>

        <select id="selectAno" onchange="renderizarDados()">
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2024" selected>2024</option>
            <option value="2023">2023</option>
        </select>
    </div>

    <div class="total-container">
        <div class="total-label">Total Liquidado</div>
        <div class="total-valor" id="totalDisplay">R$ 0,00</div>
    </div>

    <div class="chart-container">
        <canvas id="grafico"></canvas>
    </div>

    <div class="footer" id="dataAtualizacao">Conectado ao Banco de Dados Público.</div>
</div>

<script>
    const SUPABASE_URL = 'https://eqpaebepyoqxfqrxzkct.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_DWU6EdF9nMQqpwSFWzvdkg_UR_ZaF6s'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let chartInstance = null;
    let listaMandatosGeral = []; 

    async function inicializar() {
        try {
            // Realiza um JOIN entre mandato e politico para associar o cargo ao nome
            const { data: mandatos, error } = await supabaseClient
                .from('mandato')
                .select(`
                    id,
                    cargo,
                    politico:politico_id ( id, nome_civil )
                `)
                .order('cargo', { ascending: true });

            if (error) throw error;

            if (!mandatos || mandatos.length === 0) {
                document.getElementById('selectPolitico').innerHTML = '<option>Nenhum dado encontrado.</option>';
                return;
            }

            // Ordena alfabeticamente pelo nome do político
            listaMandatosGeral = mandatos.sort((a, b) => {
                const nomeA = a.politico?.nome_civil || '';
                const nomeB = b.politico?.nome_civil || '';
                return nomeA.localeCompare(nomeB);
            });

            filtrarPoliticos();

        } catch (error) {
            console.error("Falha de conexão:", error);
            document.getElementById('totalDisplay').innerText = "Erro ao acessar a base.";
        }
    }

    function filtrarPoliticos() {
        const cargoSelecionado = document.getElementById('selectCargo').value;
        const selectPolitico = document.getElementById('selectPolitico');
        
        selectPolitico.innerHTML = '';

        const mandatosFiltrados = cargoSelecionado === "Todos" 
            ? listaMandatosGeral 
            : listaMandatosGeral.filter(m => m.cargo === cargoSelecionado);

        if (mandatosFiltrados.length === 0) {
            const opt = document.createElement('option');
            opt.innerText = "Nenhum político registrado neste cargo.";
            opt.value = "";
            selectPolitico.appendChild(opt);
            atualizarGrafico({}, 0);
            return;
        }

        mandatosFiltrados.forEach(m => {
            if (m.politico) {
                const opt = document.createElement('option');
                opt.value = m.id; // O valor agora é o ID do mandato direto
                opt.innerText = `${m.politico.nome_civil} (${m.cargo})`;
                selectPolitico.appendChild(opt);
            }
        });

        renderizarDados();
    }

    async function renderizarDados() {
        const mandatoId = document.getElementById('selectPolitico').value;
        const ano = document.getElementById('selectAno').value;

        if (!mandatoId) {
            atualizarGrafico({}, 0);
            return;
        }

        try {
            const dataInicio = `${ano}-01-01`;
            const dataFim = `${ano}-12-31`;

            const { data: despesas, error } = await supabaseClient
                .from('despesa')
                .select('tipo_verba, valor_pago')
                .eq('mandato_id', mandatoId)
                .gte('data_emissao', dataInicio)
                .lte('data_emissao', dataFim);

            if (error) throw error;

            let gastosAgrupados = {};
            let total = 0;

            despesas.forEach(d => {
                const tipo = d.tipo_verba;
                const valor = parseFloat(d.valor_pago);
                gastosAgrupados[tipo] = (gastosAgrupados[tipo] || 0) + valor;
                total += valor;
            });

            atualizarGrafico(gastosAgrupados, total);

        } catch (error) {
            console.error("Erro na extração de despesas:", error);
        }
    }

    function atualizarGrafico(gastos, total) {
        document.getElementById('totalDisplay').innerText = "R$ " + total.toLocaleString('pt-BR', { minimumFractionDigits: 2 });

        const labels = Object.keys(gastos);
        const valores = Object.values(gastos);

        if (chartInstance) {
            chartInstance.destroy();
        }

        const ctx = document.getElementById('grafico').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels.length > 0 ? labels : ['Sem registros no período'],
                datasets: [{
                    label: 'Despesa (R$)',
                    data: valores.length > 0 ? valores : [0],
                    backgroundColor: '#1976d2',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        ticks: {
                            callback: function(val, index) {
                                const texto = this.getLabelForValue(val);
                                return texto.length > 18 ? texto.substr(0, 18) + '...' : texto;
                            }
                        }
                    },
                    y: { beginAtZero: true }
                }
            }
        });
    }

    inicializar();
</script>

</body>
</html>
