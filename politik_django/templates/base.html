<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PolitiK - Plataforma de Transparência Pública para monitoramento de gastos políticos">
    <title>{% block title %}PolitiK - Transparência Pública{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
                        danger: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 900: '#7f1d1d' },
                        success: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#14532d' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface-50 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- NAVBAR INTEGRADA E LIMPA -->
    <nav class="bg-white border-b border-surface-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo e Links de Navegação Estrutural -->
                <div class="flex items-center">
                    <!-- Correção: Link aponta para a raiz '/' e a logo foi redesenhada de forma tipográfica -->
                    <a href="/" class="flex items-center gap-2 group mr-8">
                        <div class="w-8 h-8 bg-surface-900 text-white rounded flex items-center justify-center font-bold text-lg group-hover:bg-primary-600 transition-colors">
                            P
                        </div>
                        <span class="font-black text-xl text-surface-900 tracking-tight">PolitiK</span>
                    </a>
                    
                    <div class="hidden sm:flex sm:space-x-6">
                        <a href="/" class="border-surface-900 text-surface-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-bold">
                            Dashboard
                        </a>
                        <a href="/alertas/" class="border-transparent text-surface-500 hover:border-surface-300 hover:text-surface-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-semibold transition-colors">
                            Central de Alertas
                        </a>
                    </div>
                </div>
                
                <!-- NOTA ARQUITETÔNICA: 
                     Não há barra de busca ou botões de login aqui. 
                     Esses elementos são dinâmicos e agora pertencem exclusivamente ao index.html 
                     para não poluírem ou quebrarem outras telas do sistema. -->
            </div>
        </div>
    </nav>

    <!-- Área de Conteúdo Principal -->
    <main class="flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER INTEGRADO E LIMPO -->
    <footer class="bg-white border-t border-surface-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-surface-500 font-medium">
                &copy; 2026 PolitiK - Plataforma de Transparência Nacional.
            </p>
        </div>
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
