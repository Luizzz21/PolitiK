version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: politik_postgres
    restart: always
    environment:
      POSTGRES_DB: politik_db
      POSTGRES_USER: politik_user
      POSTGRES_PASSWORD: politik_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: politik_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: politik_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn politik_django.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./politik_django:/app/politik_django
      - static_volume:/app/politik_django/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - POSTGRES_DB=politik_db
      - POSTGRES_USER=politik_user
      - POSTGRES_PASSWORD=politik_password_123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: politik_celery
    restart: always
    command: celery -A politik_django worker -l info
    volumes:
      - ./politik_django:/app/politik_django
    environment:
      - DEBUG=False
      - POSTGRES_DB=politik_db
      - POSTGRES_USER=politik_user
      - POSTGRES_PASSWORD=politik_password_123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      - db
      - redis
      - web

  celery-beat:
    build: .
    container_name: politik_celery_beat
    restart: always
    command: celery -A politik_django beat -l info
    volumes:
      - ./politik_django:/app/politik_django
    environment:
      - DEBUG=False
      - POSTGRES_DB=politik_db
      - POSTGRES_USER=politik_user
      - POSTGRES_PASSWORD=politik_password_123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
    depends_on:
      - db
      - redis
      - celery

volumes:
  postgres_data:
  redis_data:
  static_volume:
