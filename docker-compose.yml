services:
  db:
    image: postgres:15-alpine
    container_name: politik_postgres
    restart: always
    environment:
      POSTGRES_DB: politik_db
      POSTGRES_USER: politik_user
      POSTGRES_PASSWORD: politik_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: politik_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
