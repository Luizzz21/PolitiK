version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: politik_postgres
    restart: always
    environment:
      POSTGRES_DB: politik_db
      POSTGRES_USER: politik_user
      POSTGRES_PASSWORD: politik_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
