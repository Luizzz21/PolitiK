<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolitiK - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h3 { text-align: center; color: #333; }
        .total { font-size: 24px; font-weight: bold; text-align: center; color: #d32f2f; margin-bottom: 20px; }
        .footer { text-align: center; font-size: 12px; color: #888; margin-top: 30px; }
        /* Estilos do Botão de Recarregar */
        .btn-recarregar { display: none; margin: 0 auto 20px auto; padding: 10px 20px; font-size: 16px; background-color: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; text-align: center; }
        .btn-recarregar:hover { background-color: #115293; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo">Carregando painel...</h1>
    <div class="total" id="valorTotal">Buscando dados diretamente da API da Câmara...</div>
    
    <!-- Botão de recarregar, inicialmente oculto -->
    <button id="btnRecarregar" class="btn-recarregar" onclick="iniciarBusca()">Tentar Novamente</button>
    
    <canvas id="meuGrafico"></canvas>
    
    <div class="footer" id="dataAtualizacao"></div>
</div>

<script>
    const DEPUTADO_ID = '204374';
    const URL_API = `https://dadosabertos.camara.leg.br/api/v2/deputados/${DEPUTADO_ID}/despesas?itens=100`;
    let graficoInstancia = null;

    // Função de Fetch com lógica de Retry e Backoff
    async function fetchComRetry(url, tentativas = 3) {
        let erroRecente;
        for (let i = 0; i < tentativas; i++) {
            try {
                // Adicionamos um cabeçalho de simulação e controle de cache
                const response = await fetch(url, {
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store'
                });
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                erroRecente = error;
                console.warn(`Tentativa ${i + 1} falhou. Aguardando para tentar novamente...`);
                // Espera um tempo progressivo (1s, 2s, 4s...) antes da próxima tentativa
                await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
            }
        }
        throw erroRecente;
    }

    function iniciarBusca() {
        // Reseta o estado visual inicial
        document.getElementById('titulo').innerText = 'Carregando painel...';
        document.getElementById('valorTotal').innerText = 'Buscando dados da API...';
        document.getElementById('btnRecarregar').style.display = 'none';

        fetchComRetry(URL_API)
            .then(data => {
                const despesas = data.dados;

                if (despesas.length === 0) {
                    document.getElementById('titulo').innerText = 'Nenhuma despesa recente encontrada';
                    document.getElementById('valorTotal').innerText = 'Total Gasto: R$ 0,00';
                    return;
                }

                let gastosAgrupados = {};
                let totalGasto = 0;

                despesas.forEach(despesa => {
                    const tipo = despesa.tipoDespesa;
                    const valor = parseFloat(despesa.valorDocumento);
                    gastosAgrupados[tipo] = (gastosAgrupados[tipo] || 0) + valor;
                    totalGasto += valor;
                });

                document.getElementById('titulo').innerText = 'Gastos Recentes da Cota Parlamentar';
                document.getElementById('valorTotal').innerText = `Total Gasto: R$ ${totalGasto.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
                document.getElementById('dataAtualizacao').innerText = `Consulta efetuada em: ${new Date().toLocaleString('pt-BR')}`;

                const categorias = Object.keys(gastosAgrupados);
                const valores = Object.values(gastosAgrupados);

                // Destrói o gráfico antigo antes de criar o novo (evita sobreposição)
                if (graficoInstancia) {
                    graficoInstancia.destroy();
                }

                const ctx = document.getElementById('meuGrafico').getContext('2d');
                graficoInstancia = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: categorias,
                        datasets: [{
                            label: 'Gasto em R$',
                            data: valores,
                            backgroundColor: '#1976d2',
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            })
            .catch(error => {
                console.error('Erro de processamento:', error);
                document.getElementById('titulo').innerText = 'Erro de Conexão';
                document.getElementById('valorTotal').innerText = 'Não foi possível carregar os dados após várias tentativas.';
                // Exibe o botão para o usuário forçar a recarga
                document.getElementById('btnRecarregar').style.display = 'block';
            });
    }

    // Inicia a busca automaticamente ao abrir a página
    iniciarBusca();
</script>

</body>
</html>
