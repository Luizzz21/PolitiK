<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolitiK - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h3 { text-align: center; color: #333; }
        .total { font-size: 24px; font-weight: bold; text-align: center; color: #d32f2f; margin-bottom: 20px; }
        .footer { text-align: center; font-size: 12px; color: #888; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo">Carregando painel...</h1>
    <div class="total" id="valorTotal">Buscando dados diretamente da API da Câmara...</div>
    
    <canvas id="meuGrafico"></canvas>
    
    <div class="footer" id="dataAtualizacao"></div>
</div>

<script>
    // Configuração do alvo da pesquisa (ID 204374) consultando as 100 despesas mais recentes
    const DEPUTADO_ID = '204374';
    const URL_API = `https://dadosabertos.camara.leg.br/api/v2/deputados/${DEPUTADO_ID}/despesas?itens=100`;

    // A requisição ocorre diretamente no navegador do usuário
    fetch(URL_API)
        .then(response => {
            if (!response.ok) {
                throw new Error('Falha na comunicação com o servidor governamental.');
            }
            return response.json();
        })
        .then(data => {
            const despesas = data.dados;

            if (despesas.length === 0) {
                document.getElementById('titulo').innerText = 'Nenhuma despesa recente encontrada';
                document.getElementById('valorTotal').innerText = 'Total Gasto: R$ 0,00';
                return;
            }

            // Agrupamento matemático dos valores por categoria
            let gastosAgrupados = {};
            let totalGasto = 0;

            despesas.forEach(despesa => {
                const tipo = despesa.tipoDespesa;
                const valor = parseFloat(despesa.valorDocumento);

                if (gastosAgrupados[tipo]) {
                    gastosAgrupados[tipo] += valor;
                } else {
                    gastosAgrupados[tipo] = valor;
                }
                totalGasto += valor;
            });

            // Renderização das informações em tela
            document.getElementById('titulo').innerText = 'Gastos Recentes da Cota Parlamentar';
            document.getElementById('valorTotal').innerText = `Total Gasto: R$ ${totalGasto.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            
            const dataAtual = new Date();
            document.getElementById('dataAtualizacao').innerText = `Consulta efetuada em: ${dataAtual.toLocaleString('pt-BR')}`;

            // Geração do gráfico de barras
            const categorias = Object.keys(gastosAgrupados);
            const valores = Object.values(gastosAgrupados);

            const ctx = document.getElementById('meuGrafico').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: categorias,
                    datasets: [{
                        label: 'Gasto em R$',
                        data: valores,
                        backgroundColor: '#1976d2',
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
        })
        .catch(error => {
            console.error('Erro de processamento:', error);
            document.getElementById('titulo').innerText = 'Erro de Conexão';
            document.getElementById('valorTotal').innerText = 'Não foi possível estabelecer link com a Câmara.';
        });
</script>

</body>
</html>
